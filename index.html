  <title>WISHTWA - Coming Soon</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  color: #111;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.poster {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 40px 20px;
}

.protein {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 6px;
  margin-bottom: 36px;
}

.ingredient-stage {
  position: relative;
  width: min(72vw, 520px);
  height: 300px;
  margin-bottom: 36px;
}

.ingredient {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.8s ease-in-out;
}

.ingredient.active { opacity: 1; }

.wordmark {
  font-size: clamp(38px, 8vw, 64px);
  font-weight: 900;
  letter-spacing: 2px;
  line-height: 1;
}

.coming {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 8px;
  margin-top: 10px;
}

.countdown {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 44px;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 64px;
}

.unit span {
  font-size: 34px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.unit label {
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 4px;
  color: #555;
}

.sep {
  font-size: 28px;
  font-weight: 800;
  padding-bottom: 16px;
  color: #999;
}

</style>

    <h1 class="wordmark">WISHTWA</h1>
    <p class="coming">COMING SOON</p>

    <div class="countdown" id="countdown">
      <div class="unit"><span id="days">00</span><label>Days</label></div>
      <div class="sep">:</div>
      <div class="unit"><span id="hours">00</span><label>Hours</label></div>
      <div class="sep">:</div>
      <div class="unit"><span id="minutes">00</span><label>Mins</label></div>
      <div class="sep">:</div>
      <div class="unit"><span id="seconds">00</span><label>Secs</label></div>
    </div>
  </main>

  <script>
// Ingredient slideshow: only the image changes, everything else stays.
const slides = document.querySelectorAll('.ingredient');
let current = 0;
setInterval(() => {
  slides[current].classList.remove('active');
  current = (current + 1) % slides.length;
  slides[current].classList.add('active');
}, 6000);

// Countdown to 1 December 2026, 8:00 PM IST.
const target = new Date('2026-12-01T20:00:00+05:30').getTime();
const pad = n => String(n).padStart(2, '0');

function tick() {
  const diff = target - Date.now();
  if (diff <= 0) {
    document.getElementById('days').textContent = '00';
    document.getElementById('hours').textContent = '00';
    document.getElementById('minutes').textContent = '00';
    document.getElementById('seconds').textContent = '00';
    return;
  }
  const s = Math.floor(diff / 1000);
  document.getElementById('days').textContent = pad(Math.floor(s / 86400));
  document.getElementById('hours').textContent = pad(Math.floor((s % 86400) / 3600));
  document.getElementById('minutes').textContent = pad(Math.floor((s % 3600) / 60));
  document.getElementById('seconds').textContent = pad(s % 60);
}
tick();
setInterval(tick, 1000);

</script>
